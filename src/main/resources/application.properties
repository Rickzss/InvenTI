spring.application.name=inventidemo

# Banco padrão: H2 em memória (zero configuração). As tabelas são criadas a
# partir das entidades JPA e os dados iniciais vêm de config/DataInitializer.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

