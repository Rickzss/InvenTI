<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<body>

    <!--
        Menu lateral compartilhado. Uso: th:replace="~{fragments/menu :: menu('home')}"
        Valores de "ativo": home | equipamentos | usuarios | solicitacoes | cadastro | solicitacao
        Administrador vê o menu completo; Solicitante vê apenas "Solicitações" e "Sair".
    -->
    <aside class="menu-lateral" th:fragment="menu(ativo)">

        <header class="perfil">
            <h1 class="logo"><span class="inven">Inven</span>TI</h1>
            <div class="avatar"></div>
            <p class="nome" th:text="${usuarioLogado.nome}">Admin</p>
            <p class="cargo" th:text="${usuarioLogado.perfil.rotulo}">Administrador</p>
        </header>

        <nav class="navegacao">
            <ul th:if="${usuarioLogado.administrador}">
                <li><a th:href="@{/home}" th:classappend="${ativo == 'home'} ? 'ativo'">Home</a></li>
                <li><a th:href="@{/equipamentos}" th:classappend="${ativo == 'equipamentos'} ? 'ativo'">Equipamentos</a></li>
                <li><a th:href="@{/usuarios}" th:classappend="${ativo == 'usuarios'} ? 'ativo'">Usuários</a></li>
                <li><a th:href="@{/solicitacoes}" th:classappend="${ativo == 'solicitacoes'} ? 'ativo'">Solicitações</a></li>
                <li><a th:href="@{/cadastro}" th:classappend="${ativo == 'cadastro'} ? 'ativo'">Cadastro</a></li>
                <li><a th:href="@{/logout}">Sair</a></li>
            </ul>
            <ul th:unless="${usuarioLogado.administrador}">
                <li><a th:href="@{/solicitacao}" class="ativo">Solicitações</a></li>
                <li><a th:href="@{/logout}">Sair</a></li>
            </ul>
        </nav>

    </aside>

</body>
</html>
